    <script language="javascript">
      function zeroPad(str, len) {
	  if (len <= 0) {
	      return str;
	  }
	  while (str.length < len) {
	      str = '0' + str;
	  }
	  return str;
      }
      function updatePage() {
	  var ngc_number = document.getElementById('search_input').value;
	  if (isNaN(ngc_number) || ngc_number > 7840 || ngc_number < 1) {
	      window.alert('Invalid NGC number entered. Check your entry and try again!');
	      return;
	  }
	  var url = 'http://ngcicproject.observers.org/NGC/NGC_' + zeroPad(Math.floor(ngc_number/100).toString(), 2) + 'xx/NGC_' + zeroPad(Math.floor(ngc_number).toString(), 4) + '.htm';
	  document.getElementById('main_frame').src = url;
      }
      function init() {
	  document.getElementById('search_input').addEventListener('keyup', function(event) {
	      if (event.keyCode == 13) {
		  event.preventDefault();
		  document.getElementById('go_button').click();
	      }
	  });
      }
      window.onload = init;
    </script>
    <script src="/assets/js/bas-theme.js"></script>

      <button id="go_button" onclick="updatePage();">Go</button>
