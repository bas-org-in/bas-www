# Run before each commit, and in CI (.github/workflows/checks.yml).
# Setup and use: README.md, "Checks".
# Vendored third-party assets are not checked.
exclude: ^public/(bootstrap|font-awesome-4\.7\.0)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint-cli2
        language: system
        entry: npx --no-install markdownlint-cli2
        types: [markdown]
      - id: eslint
        name: eslint
        language: system
        entry: npx --no-install eslint --max-warnings=0 --no-warn-ignored
        types: [javascript]
      - id: stylelint
        name: stylelint (design tokens)
        language: system
        entry: npx --no-install stylelint
        types: [css]
      - id: inline-styles
        name: no inline styles in templates
        language: system
        entry: node scripts/check-inline-styles.mjs
        files: \.(html?|inc|php)$
